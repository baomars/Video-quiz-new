<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#cyberBg)" />
  <!-- Grid lines -->
  <line x1="0" y1="225" x2="600" y2="225" stroke="#0284c7" stroke-width="1" opacity="0.3" />
  <line x1="300" y1="0" x2="300" y2="450" stroke="#0284c7" stroke-width="1" opacity="0.3" />
  <!-- Glowing head circle -->
  <circle cx="300" cy="200" r="110" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
  <!-- Visor / Eyes -->
  <rect x="230" y="170" width="140" height="40" rx="20" fill="#06b6d4" />
  <circle cx="265" cy="190" r="8" fill="#ffffff" />
  <circle cx="335" cy="190" r="8" fill="#ffffff" />
  <!-- Antenna -->
  <line x1="300" y1="90" x2="300" y2="45" stroke="#38bdf8" stroke-width="5" />
  <circle cx="300" cy="40" r="12" fill="#06b6d4" />
  <!-- Neck/Shoulders -->
  <rect x="270" y="310" width="60" height="40" fill="#1e293b" />
  <path d="M190,390 L410,390 L390,350 L210,350 Z" fill="#0284c7" />
</svg>
